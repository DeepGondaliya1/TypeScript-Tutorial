# 1) What is TypeScript?
# TypeScript is a typed superset of JavaScript that compiles to plain JavaScript.

# 2) Why Learn TypeScript?
# TypeScript offers several advantages over JavaScript, such as static typing, interfaces, enums, and advanced tooling support. These features can lead to fewer bugs, improved code quality, better IDE support, and enhanced developer productivity, especially in larger projects with complex codebases.

# 3) How do I install TypeScript?
# npm install typescript -g

# 4) What is tsconfig.json?
# The presence of a tsconfig.json file in a directory indicates that the directory is the root of a TypeScript project. The tsconfig.json file specifies the root files and the compiler options required to compile the project.
# JavaScript projects can use a jsconfig.json file instead, which acts almost the same but has some JavaScript-related compiler flags enabled by default.

# 5) What is Type Annotations?
# A type annotation, sometimes called a type hint. type annotations offer a way to define (or annotate) the data types of variables, class members, function parameters and return values.  By the term "type annotations" means assigning the datatypes.

# 6) What is Type Inference?
# Type inference is a process that automatically assigns types to variables, functions, and expressions in a program. It can be done at compile time or runtime.
